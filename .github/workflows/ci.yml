# nexo-mcp — pruebas en cada pull request y en main (sin base de datos ni Azure: todo en memoria)
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --quiet --timeout 60 --retries 10 -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest -q
      - name: La imagen se construye
        run: docker build -t nexo-mcp:ci .
